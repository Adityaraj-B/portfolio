<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070a" />

  <title>Adityaraj Bagwan | Flutter &amp; Full-Stack Engineer</title>
  <meta name="description"
    content="Adityaraj Bagwan builds production-grade Flutter apps and full-stack platforms with Node, Firebase, Google Cloud and the Gemini API. Selected work, experience and credentials." />
  <meta name="author" content="Adityaraj Bagwan" />
  <link rel="canonical" href="https://adityaraj-portfolio.web.app/" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Adityaraj Bagwan | Flutter &amp; Full-Stack Engineer" />
  <meta property="og:description"
    content="Production Flutter apps, full-stack platforms and applied AI on Google Cloud." />
  <meta property="og:url" content="https://adityaraj-portfolio.web.app/" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Fonts: display serif + grotesque + mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <script>
    // Apply the stored theme before first paint so there is no flash of the
    // wrong palette on reload.
    (function () {
      try {
        var saved = localStorage.getItem('portfolio-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) { /* storage blocked — keep the dark default */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
